<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SphereTempo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <div class="app-background">
        <div class="glass-card">
            <header>
                <h2 id="cityName">SphereTempo</h2> 
                <h1 id="tempDisplay">--°</h1>
                <p id="condition">Busque uma cidade</p>
                <p id="dateInfo" style="font-size: 0.8rem; margin-top: 10px;"></p>
            </header>

            <section class="search-section">
                <input type="text" id="cityInput" placeholder="Busque uma cidade...">
                <button id="searchBtn">🔍</button>
            </section>

            <div id="weatherResult"></div>
        </div>
    </div>

    <script type="module" src="./js/api.js"></script>
</body>
</html>
